<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YÖNETİCİ - Çandarlı Haritası</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SADECE GÜVENLİ CLOUDFLARE CDN KULLANILDI (Engellenmez) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <link rel="manifest" href="manifest-yonetici.json">
<meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #cbd5e1; }
        #map { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        .custom-popup .leaflet-popup-content-wrapper { border-radius: 12px; padding: 0; overflow: hidden; }
        .custom-popup .leaflet-popup-content { margin: 0; }
        .custom-flag-icon { background: transparent; border: none; }
    </style>
</head>
<body class="font-sans">

    <!-- Harita Alanı -->
    <div id="map"></div>

    <!-- Mobil Uyumlu Düzenli Üst Bar (Asla Alt Alta Binmez) -->
    <div style="z-index: 1000;" class="fixed top-3 left-3 right-3 flex flex-col gap-2.5 pointer-events-none">
        
        <!-- 1. Satır: Başlık ve GitHub -->
        <div class="flex justify-between items-center w-full">
            <div class="bg-amber-500/95 text-white backdrop-blur-md px-3.5 py-1.5 rounded-xl shadow-xl pointer-events-auto flex items-center space-x-2 border border-amber-400">
                <span class="text-lg">🛠️</span>
                <h1 class="font-bold text-sm">Yönetici Paneli</h1>
            </div>
            
            <button onclick="openGithubModal()" id="ghBtn" class="bg-gray-800 hover:bg-gray-900 text-white font-semibold px-3 py-1.5 rounded-xl shadow-xl transition flex items-center space-x-1 cursor-pointer text-xs pointer-events-auto">
                <span>⚙️ GitHub</span>
            </button>
        </div>

        <!-- 2. Satır: Arama ve Ekle -->
        <div class="flex justify-between items-center w-full gap-2 pointer-events-auto">
            <div class="relative flex-1">
                <input type="text" id="searchInput" placeholder="Haritada yer ara..." oninput="handleSearch(this.value)" class="w-full bg-white/95 backdrop-blur-md px-3.5 py-2 rounded-xl shadow-lg border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                <div id="searchDropdown" class="absolute left-0 right-0 mt-1 bg-white rounded-xl shadow-2xl border border-gray-100 hidden overflow-hidden max-h-48 overflow-y-auto" style="z-index: 2000;"></div>
            </div>

            <button onclick="activateAddMode()" id="addBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-xl shadow-lg transition flex items-center space-x-1 cursor-pointer text-sm shrink-0">
                <span>+ Ekle</span>
            </button>
        </div>
    </div>

    <!-- Bilgi Banner -->
    <div id="instructionBanner" style="z-index: 1000;" class="fixed top-28 left-1/2 transform -translate-x-1/2 bg-gray-900/90 text-white px-5 py-2.5 rounded-xl text-xs shadow-lg hidden pointer-events-none whitespace-nowrap">
        Haritada bayrak dikmek istediğin yere dokun 🚩
    </div>

    <!-- Bildirim Mesajı (Toast) -->
    <div id="toast" style="z-index: 3000;" class="fixed bottom-6 left-4 right-4 bg-gray-900/95 text-white px-4 py-3 rounded-2xl shadow-2xl text-xs text-center font-medium hidden transition-all"></div>

    <!-- GitHub Ayarları Modalı -->
    <div id="ghModal" style="z-index: 2500;" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-5 shadow-2xl">
            <h3 class="text-base font-bold text-gray-900 mb-1">☁️ GitHub Otomatik Kayıt</h3>
            <p class="text-xs text-gray-500 mb-3">Bu bilgiler telefonda saklanır.</p>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">GitHub Kullanıcı Adın</label>
                    <input type="text" id="ghOwner" class="w-full px-3 py-2 rounded-xl border border-gray-300 text-sm" placeholder="tamer1972yildirim-sketch">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Depo (Repository) Adı</label>
                    <input type="text" id="ghRepo" class="w-full px-3 py-2 rounded-xl border border-gray-300 text-sm" placeholder="candarli-kesif-haritasi">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">GitHub Token (Şifren)</label>
                    <input type="password" id="ghToken" class="w-full px-3 py-2 rounded-xl border border-gray-300 text-sm" placeholder="ghp_xxxxxxxxxxxx">
                </div>
            </div>
            <div class="flex space-x-2 pt-4">
                <button type="button" onclick="closeGithubModal()" class="flex-1 bg-gray-100 text-gray-800 font-semibold py-2.5 rounded-xl text-sm">Kapat</button>
                <button type="button" onclick="saveGithubConfig()" class="flex-1 bg-emerald-600 text-white font-semibold py-2.5 rounded-xl text-sm">Kaydet</button>
            </div>
        </div>
    </div>

    <!-- Ekleme & Düzenleme Modalı -->
    <div id="modal" style="z-index: 2000;" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-3">
        <div class="bg-white rounded-3xl max-w-md w-full shadow-2xl flex flex-col overflow-hidden" style="max-height: 85dvh;">
            
            <div class="px-4 py-3 border-b border-gray-100 flex justify-between items-center shrink-0">
                <h3 id="modalTitle" class="text-base font-bold text-gray-900">Nokta Ekle</h3>
                <button type="button" onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold leading-none">&times;</button>
            </div>

            <form id="pointForm" class="flex flex-col flex-1 overflow-hidden">
                <div class="p-4 space-y-3 overflow-y-auto flex-1">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Başlık</label>
                        <input type="text" id="pointTitle" required class="w-full px-3 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Kategori</label>
                        <select id="pointCategory" class="w-full px-3 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-white">
                            <option value="Manzara">🔵 Manzara</option>
                            <option value="Tarihi Bina / Kale">🟡 Tarihi Bina / Kale</option>
                            <option value="Yerel İşletme / Esnaf">🟢 Yerel İşletme / Esnaf</option>
                            <option value="Resmi Kurum">🔴 Resmi Kurum</option>
                            <option value="Eğitim / Kültür">🟣 Eğitim / Kültür</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Fotoğraf</label>
                        
                        <div id="currentPhotoPreview" class="hidden mb-2 flex items-center space-x-3 bg-gray-50 p-2 rounded-xl border border-gray-200">
                            <img id="previewImg" src="" class="h-12 w-16 rounded-lg object-cover border border-gray-300 shrink-0">
                            <div class="flex-1 min-w-0">
                                <p id="photoStatusText" class="text-xs font-semibold text-emerald-700 truncate">Fotoğraf Hazır</p>
                                <button type="button" onclick="clearSelectedPhoto()" class="text-xs text-red-600 hover:underline mt-0.5">Kaldır</button>
                            </div>
                        </div>

                        <div id="liveCameraBox" class="hidden mb-2 bg-black rounded-2xl overflow-hidden relative">
                            <video id="cameraVideo" autoplay playsinline class="w-full h-32 object-cover"></video>
                            <div class="p-2 bg-gray-900 flex justify-between items-center">
                                <button type="button" onclick="stopLiveCamera()" class="text-xs text-gray-300 px-3 py-1">İptal</button>
                                <button type="button" onclick="takeSnapshot()" class="bg-emerald-500 text-white text-xs font-bold px-4 py-1.5 rounded-xl">📸 Çek</button>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <label for="pointPhotoFile" class="flex items-center justify-center space-x-1.5 py-2 px-2 rounded-xl bg-blue-50 text-blue-700 font-semibold text-xs cursor-pointer border border-blue-200">
                                <span>📁</span><span>Galeri</span>
                            </label>
                            <input type="file" id="pointPhotoFile" accept="image/*" class="hidden" onchange="handlePhotoInput(this, 'Galeriden seçildi')">

                            <button type="button" onclick="triggerCamera()" class="flex items-center justify-center space-x-1.5 py-2 px-2 rounded-xl bg-emerald-50 text-emerald-700 font-semibold text-xs cursor-pointer border border-emerald-200">
                                <span>📷</span><span>Kamera</span>
                            </button>
                            <input type="file" id="pointPhotoCamera" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoInput(this, 'Kameradan çekildi')">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Açıklama</label>
                        <textarea id="pointDesc" rows="2" class="w-full px-3 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm"></textarea>
                    </div>
                </div>

                <div class="p-3 bg-gray-50 border-t border-gray-200 flex space-x-2 shrink-0">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-white border border-gray-300 text-gray-800 font-semibold py-2.5 rounded-xl text-sm">İptal</button>
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl text-sm">Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Hata yakalayıcı (Ekranda hata olursa gösterir)
        window.onerror = function(msg, url, line) {
            showToast("Hata: " + msg);
        };

        const DEFAULT_OWNER = "tamer1972yildirim-sketch";
        const DEFAULT_REPO = "candarli-kesif-haritasi";

        const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { attribution: 'Google', maxZoom: 20 });
        const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri', maxZoom: 20, maxNativeZoom: 17 });
        const osmStreet = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OSM', maxZoom: 19 });

        const map = L.map('map', { center: [38.9335, 26.9325], zoom: 15, zoomControl: false, layers: [googleHybrid] });
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.control.layers({ "Uydu + Sokak (Google)": googleHybrid, "Saf Uydu (Esri)": esriSatellite, "Sokak (OSM)": osmStreet }, null, { position: 'bottomleft' }).addTo(map);

        setTimeout(() => { map.invalidateSize(); }, 300);

        let markersLayer = L.layerGroup().addTo(map);
        let markersMap = {}; 
        let isAddMode = false;
        let tempCoords = null;
        let editingPointId = null;
        let currentCompressedPhoto = null;
        let cameraStream = null;

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); }, 4000);
        }

        function getCategoryColor(category) {
            if (category === 'Manzara') return '#3b82f6';
            if (category === 'Tarihi Bina / Kale') return '#f59e0b';
            if (category === 'Yerel İşletme / Esnaf') return '#10b981';
            if (category === 'Resmi Kurum') return '#ef4444';
            if (category === 'Eğitim / Kültür') return '#8b5cf6';
            return '#6b7280';
        }

        function createFlagIcon(category) {
            const color = getCategoryColor(category);
            return L.divIcon({
                className: 'custom-flag-icon',
                html: '<svg width="34" height="40" viewBox="0 0 34 40" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0px 3px 4px rgba(0,0,0,0.5));">' +
                      '<circle cx="6" cy="37" r="3" fill="#1f2937" stroke="white" stroke-width="1.5"/>' +
                      '<line x1="6" y1="4" x2="6" y2="37" stroke="white" stroke-width="4" stroke-linecap="round"/>' +
                      '<line x1="6" y1="4" x2="6" y2="37" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>' +
                      '<path d="M7 5 C15 2, 23 8, 31 5 L27 14 L31 22 C23 25, 15 19, 7 22 Z" fill="' + color + '" stroke="white" stroke-width="2" stroke-linejoin="round"/>' +
                      '</svg>',
                iconSize: [34, 40],
                iconAnchor: [6, 37],
                popupAnchor: [8, -34]
            });
        }

        function getStoredPoints() {
            try {
                const data = localStorage.getItem('candarli_points');
                if (data) {
                    const parsed = JSON.parse(data);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                }
                if (window.CANDARLI_DATA && Array.isArray(window.CANDARLI_DATA)) {
                    localStorage.setItem('candarli_points', JSON.stringify(window.CANDARLI_DATA));
                    return window.CANDARLI_DATA;
                }
                return [];
            } catch (e) { return []; }
        }

        window.openGithubModal = function() {
            document.getElementById('ghOwner').value = localStorage.getItem('gh_owner') || DEFAULT_OWNER;
            document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || DEFAULT_REPO;
            document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';
            document.getElementById('ghModal').classList.remove('hidden');
        };

        window.closeGithubModal = function() {
            document.getElementById('ghModal').classList.add('hidden');
        };

        window.saveGithubConfig = async function() {
            const owner = document.getElementById('ghOwner').value.trim() || DEFAULT_OWNER;
            const repo = document.getElementById('ghRepo').value.trim() || DEFAULT_REPO;
            const token = document.getElementById('ghToken').value.trim();
            if (!token) {
                alert("Lütfen GitHub Token girin.");
                return;
            }
            localStorage.setItem('gh_owner', owner);
            localStorage.setItem('gh_repo', repo);
            localStorage.setItem('gh_token', token);
            closeGithubModal();
            updateGhButtonStatus();
            await pushToGithub();
        };

        function updateGhButtonStatus() {
            if (localStorage.getItem('gh_token')) {
                const btn = document.getElementById('ghBtn');
                btn.classList.remove('bg-gray-800');
                btn.classList.add('bg-emerald-600');
                btn.innerHTML = '<span>☁️ Aktif</span>';
            }
        }
        updateGhButtonStatus();

        async function pushToGithub() {
            const owner = localStorage.getItem('gh_owner') || DEFAULT_OWNER;
            const repo = localStorage.getItem('gh_repo') || DEFAULT_REPO;
            const token = localStorage.getItem('gh_token');
            if (!token) {
                showToast("⚠️ GitHub Token eksik! 'GitHub' ayarından token girin.");
                return;
            }

            showToast("⏳ GitHub güncelleniyor...");
            const path = "data/veriler.js";
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

            try {
                let sha = null;
                const getRes = await fetch(apiUrl, {
                    headers: { "Authorization": `token ${token}`, "Accept": "application/vnd.github.v3+json" }
                });
                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                }

                const points = getStoredPoints();
                const jsContent = "window.CANDARLI_DATA = " + JSON.stringify(points, null, 2) + ";";
                const base64Content = btoa(unescape(encodeURIComponent(jsContent)));

                const bodyObj = {
                    message: "Harita güncellendi (" + points.length + " nokta)",
                    content: base64Content
                };
                if (sha) bodyObj.sha = sha;

                const putRes = await fetch(apiUrl, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json",
                        "Accept": "application/vnd.github.v3+json"
                    },
                    body: JSON.stringify(bodyObj)
                });

                if (putRes.ok) {
                    showToast("✅ GitHub başarıyla güncellendi!");
                } else {
                    showToast("❌ Hata! Token veya repo adını kontrol edin.");
                }
            } catch (err) {
                showToast("❌ Bağlantı hatası.");
            }
        }

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.72));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        window.handlePhotoInput = function(inputElement, sourceLabel) {
            if (inputElement.files && inputElement.files[0]) {
                const file = inputElement.files[0];
                compressImage(file, function(compressedBase64) {
                    currentCompressedPhoto = compressedBase64;
                    document.getElementById('previewImg').src = compressedBase64;
                    document.getElementById('photoStatusText').innerText = '✅ ' + sourceLabel;
                    document.getElementById('currentPhotoPreview').classList.remove('hidden');
                });
            }
        };

        window.triggerCamera = async function() {
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            if (isMobile) {
                document.getElementById('pointPhotoCamera').click();
                return;
            }
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                try {
                    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    const video = document.getElementById('cameraVideo');
                    video.srcObject = cameraStream;
                    document.getElementById('liveCameraBox').classList.remove('hidden');
                    return;
                } catch (err) {}
            }
            document.getElementById('pointPhotoCamera').click();
        };

        window.stopLiveCamera = function() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            document.getElementById('liveCameraBox').classList.add('hidden');
        };

        window.takeSnapshot = function() {
            const video = document.getElementById('cameraVideo');
            if (!video.videoWidth) return;
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 800;
            let width = video.videoWidth; let height = video.videoHeight;
            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(video, 0, 0, width, height);
            currentCompressedPhoto = canvas.toDataURL('image/jpeg', 0.75);
            document.getElementById('previewImg').src = currentCompressedPhoto;
            document.getElementById('photoStatusText').innerText = '✅ Çekildi';
            document.getElementById('currentPhotoPreview').classList.remove('hidden');
            stopLiveCamera();
        };

        window.clearSelectedPhoto = function() {
            currentCompressedPhoto = "";
            document.getElementById('pointPhotoFile').value = '';
            document.getElementById('pointPhotoCamera').value = '';
            document.getElementById('currentPhotoPreview').classList.add('hidden');
        };

        function loadPoints() {
            markersLayer.clearLayers();
            markersMap = {};
            const points = getStoredPoints();

            points.forEach(p => {
                if (!p.lat || !p.lng) return;
                const customIcon = createFlagIcon(p.category);
                const color = getCategoryColor(p.category);

                const marker = L.marker([p.lat, p.lng], { icon: customIcon }).addTo(markersLayer);
                marker.bindPopup(
                    '<div class="w-60">' +
                    (p.photo ? '<img src="' + p.photo + '" class="w-full h-32 object-cover">' : '') +
                    '<div class="p-3">' +
                    '<span class="text-xs px-2 py-0.5 rounded-full font-semibold" style="background-color: ' + color + '20; color: ' + color + '">' + (p.category || 'Genel') + '</span>' +
                    '<h3 class="font-bold text-gray-900 mt-1 text-sm">' + (p.title || 'İsimsiz Nokta') + '</h3>' +
                    '<p class="text-xs text-gray-600 mt-1">' + (p.desc || '') + '</p>' +
                    '<div class="mt-2 pt-2 border-t border-gray-100 flex justify-between items-center">' +
                    '<button onclick="editPoint(' + p.id + ')" class="text-xs text-blue-600 font-semibold cursor-pointer">✏️ Düzenle</button>' +
                    '<button onclick="deletePoint(' + p.id + ')" class="text-xs text-red-600 font-semibold cursor-pointer">🗑️ Sil</button>' +
                    '</div></div></div>',
                    { className: 'custom-popup' }
                );

                markersMap[p.id] = { marker, data: p };
            });
        }

        function handleSearch(query) {
            const q = (query || '').toLowerCase().trim();
            const dropdown = document.getElementById('searchDropdown');
            dropdown.innerHTML = '';
            if (!q) { dropdown.classList.add('hidden'); return; }

            const points = getStoredPoints();
            const filtered = points.filter(p => 
                (p.title && p.title.toLowerCase().includes(q)) || 
                (p.desc && p.desc.toLowerCase().includes(q)) || 
                (p.category && p.category.toLowerCase().includes(q))
            );

            if (filtered.length === 0) {
                dropdown.innerHTML = '<div class="p-3 text-xs text-gray-500 text-center">Bulunamadı</div>';
                dropdown.classList.remove('hidden');
                return;
            }

            filtered.forEach(p => {
                const item = document.createElement('div');
                item.className = 'p-3 hover:bg-blue-50 cursor-pointer border-b border-gray-100 text-sm';
                item.innerHTML = '<div class="font-bold text-gray-800">🚩 ' + p.title + '</div><div class="text-xs font-medium mt-0.5" style="color: ' + getCategoryColor(p.category) + '">' + p.category + '</div>';
                item.onclick = function() {
                    map.setView([p.lat, p.lng], 18);
                    if (markersMap[p.id]) markersMap[p.id].marker.openPopup();
                    dropdown.classList.add('hidden');
                    document.getElementById('searchInput').value = p.title;
                };
                dropdown.appendChild(item);
            });
            dropdown.classList.remove('hidden');
        }

        document.addEventListener('click', function(e) {
            const sInput = document.getElementById('searchInput');
            const sDrop = document.getElementById('searchDropdown');
            if (sInput && sDrop && !sInput.contains(e.target) && !sDrop.contains(e.target)) sDrop.classList.add('hidden');
        });

        function activateAddMode() {
            isAddMode = true;
            editingPointId = null;
            document.getElementById('instructionBanner').classList.remove('hidden');
            document.getElementById('addBtn').classList.add('bg-green-600');
            document.getElementById('addBtn').innerText = 'Haritaya Dokun...';
        }

        map.on('click', function(e) {
            if (!isAddMode) return;
            tempCoords = e.latlng;
            isAddMode = false;
            editingPointId = null;
            currentCompressedPhoto = null;
            document.getElementById('instructionBanner').classList.add('hidden');
            document.getElementById('addBtn').classList.remove('bg-green-600');
            document.getElementById('addBtn').innerHTML = '<span>+ Ekle</span>';
            
            document.getElementById('modalTitle').innerText = 'Nokta Ekle';
            document.getElementById('currentPhotoPreview').classList.add('hidden');
            document.getElementById('pointForm').reset();
            document.getElementById('modal').classList.remove('hidden');
        });

        window.editPoint = function(id) {
            const points = getStoredPoints();
            const point = points.find(p => p.id === id);
            if (!point) return;

            editingPointId = id;
            currentCompressedPhoto = null;
            document.getElementById('modalTitle').innerText = 'Düzenle';
            document.getElementById('pointTitle').value = point.title || '';
            document.getElementById('pointCategory').value = point.category || 'Manzara';
            document.getElementById('pointDesc').value = point.desc || '';
            document.getElementById('pointPhotoFile').value = '';
            document.getElementById('pointPhotoCamera').value = '';

            if (point.photo) {
                document.getElementById('previewImg').src = point.photo;
                document.getElementById('photoStatusText').innerText = 'Mevcut Fotoğraf';
                document.getElementById('currentPhotoPreview').classList.remove('hidden');
            } else {
                document.getElementById('currentPhotoPreview').classList.add('hidden');
            }

            map.closePopup();
            document.getElementById('modal').classList.remove('hidden');
        };

        function closeModal() {
            stopLiveCamera();
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('pointForm').reset();
            document.getElementById('currentPhotoPreview').classList.add('hidden');
            editingPointId = null;
            currentCompressedPhoto = null;
        }

        document.getElementById('pointForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const title = document.getElementById('pointTitle').value;
            const category = document.getElementById('pointCategory').value;
            const desc = document.getElementById('pointDesc').value;

            let points = getStoredPoints();
            let targetId = editingPointId;

            if (editingPointId !== null) {
                points = points.map(p => {
                    if (p.id === editingPointId) {
                        return { id: p.id, lat: p.lat, lng: p.lng, title: title, category: category, desc: desc, photo: currentCompressedPhoto !== null ? currentCompressedPhoto : p.photo };
                    }
                    return p;
                });
            } else {
                targetId = Date.now();
                points.push({ id: targetId, lat: tempCoords.lat, lng: tempCoords.lng, title: title, category: category, desc: desc, photo: currentCompressedPhoto || '' });
            }

            localStorage.setItem('candarli_points', JSON.stringify(points));
            closeModal();
            loadPoints();
            if (markersMap[targetId]) markersMap[targetId].marker.openPopup();
            
            await pushToGithub();
        });

        window.deletePoint = async function(id) {
            if (confirm("Silmek istediğinize emin misiniz?")) {
                let points = getStoredPoints();
                points = points.filter(p => p.id !== id);
                localStorage.setItem('candarli_points', JSON.stringify(points));
                loadPoints();
                await pushToGithub();
            }
        };

        loadPoints();
    </script>
    <!-- Önbelleği (cache) kırmak için v değerini güncelledik -->
    <script src="data/veriler.js?v=99" onload="if(window.CANDARLI_DATA){localStorage.setItem('candarli_points', JSON.stringify(window.CANDARLI_DATA)); loadPoints();}"></script>
</body>
