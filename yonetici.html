<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YÖNETİCİ - Çandarlı Keşif Haritası</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <link rel="manifest" href="manifest.json">
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #cbd5e1; }
        #map { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        .custom-popup .leaflet-popup-content-wrapper { border-radius: 12px; padding: 0; overflow: hidden; }
        .custom-popup .leaflet-popup-content { margin: 0; }
        .custom-flag-icon { background: transparent; border: none; }
    </style>
</head>
<body class="font-sans">

    <div id="map"></div>

    <!-- Mobil Uyumlu Düzenli Üst Bar (İki Satırlı Yapı) -->
    <div style="z-index: 1000;" class="fixed top-3 left-3 right-3 flex flex-col gap-2 pointer-events-none">
        <!-- 1. Satır: Başlık ve GitHub Ayarı -->
        <div class="flex justify-between items-center">
            <div class="bg-amber-500/95 text-white backdrop-blur-md px-3.5 py-1.5 rounded-2xl shadow-xl pointer-events-auto flex items-center space-x-2 border border-amber-400">
                <span class="text-lg">🛠️</span>
                <h1 class="font-bold text-xs md:text-sm">Çandarlı Yönetici</h1>
            </div>
            
            <button onclick="openGithubModal()" id="ghBtn" class="bg-gray-800 hover:bg-gray-900 text-white font-semibold px-3 py-1.5 rounded-2xl shadow-xl transition flex items-center space-x-1 cursor-pointer text-xs pointer-events-auto">
                <span>⚙️ GitHub</span>
            </button>
        </div>

        <!-- 2. Satır: Arama ve Ekle Butonu -->
        <div class="flex items-center gap-2 pointer-events-auto">
            <div class="relative flex-1">
                <input type="text" id="searchInput" placeholder="Haritada yer ara..." oninput="handleSearch(this.value)" class="w-full bg-white/95 backdrop-blur-md px-3.5 py-2 rounded-2xl shadow-xl border border-gray-200 text-xs md:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                <div id="searchDropdown" class="absolute left-0 right-0 mt-2 bg-white rounded-2xl shadow-2xl border border-gray-100 hidden overflow-hidden max-h-60 overflow-y-auto" style="z-index: 2000;"></div>
            </div>

            <button onclick="activateAddMode()" id="addBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-2xl shadow-xl transition flex items-center space-x-1 cursor-pointer text-xs md:text-sm shrink-0">
                <span>+ Nokta Ekle</span>
            </button>
        </div>
    </div>

    <!-- Bilgi Banner -->
    <div id="instructionBanner" style="z-index: 1000;" class="fixed top-28 left-1/2 transform -translate-x-1/2 bg-gray-900/90 text-white px
