<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Çandarlı Fotoğraf ve Keşif Haritası</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="data/veriler.js" onerror="console.log('veriler.js yüklenemedi.')"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #cbd5e1; }
        #map { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        .custom-popup .leaflet-popup-content-wrapper { border-radius: 12px; padding: 0; overflow: hidden; }
        .custom-popup .leaflet-popup-content { margin: 0; }
        .custom-flag-icon { background: transparent; border: none; }
    </style>
</head>
<body class="font-sans">

    <div id="map"></div>

    <!-- Üst Başlık, Arama ve Güncelle Butonu -->
    <div style="z-index: 1000;" class="fixed top-3 left-3 right-3 flex flex-wrap justify-between items-center gap-2 pointer-events-none">
        <div class="bg-white/95 backdrop-blur-md px-3.5 py-2 rounded-2xl shadow-xl pointer-events-auto flex items-center space-x-2 border border-gray-200">
            <span class="text-xl">📸</span>
            <h1 class="font-bold text-gray-800 text-xs md:text-base">Çandarlı Keşif Haritası</h1>
        </div>
        
        <div class="flex items-center space-x-1.5 pointer-events-auto">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="Yer ara..." oninput="handleSearch(this.value)" class="bg-white/95 backdrop-blur-md px-3 py-2 rounded-2xl shadow-xl border border-gray-200 text-xs md:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-32 md:w-52 transition">
                <div id="searchDropdown" class="absolute right-0 mt-2 w-60 bg-white rounded-2xl shadow-2xl border border-gray-100 hidden overflow-hidden max-h-60 overflow-y-auto" style="z-index: 2000;"></div>
            </div>

            <button onclick="syncFromDataFolder()" id="syncBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-3.5 py-2 rounded-2xl shadow-xl transition flex items-center space-x-1 cursor-pointer text-xs md:text-sm">
                <span>🔄 Güncelle</span>
            </button>
        </div>
    </div>

    <!-- Bildirim Mesajı (Toast) -->
    <div id="toast" style="z-index: 3000;" class="fixed bottom-6 left-4 right-4 md:left-1/2 md:right-auto md:transform md:-translate-x-1/2 bg-gray-900/95 text-white px-5 py-3 rounded-2xl shadow-2xl text-xs md:text-sm text-center font-medium hidden transition-all"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        if (typeof L === 'undefined') {
            document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"><\/script>');
        }
    </script>
    <script>
        const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { attribution: 'Google', maxZoom: 20 });
        const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri', maxZoom: 20, maxNativeZoom: 17 });
        const osmStreet = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OSM', maxZoom: 19 });

        const map = L.map('map', { center: [38.9335, 26.9325], zoom: 15, zoomControl: false, layers: [googleHybrid] });
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.control.layers({ "Uydu + Sokak (Google)": googleHybrid, "Saf Uydu (Esri)": esriSatellite, "Sokak (OSM)": osmStreet }, null, { position: 'bottomleft' }).addTo(map);

        setTimeout(() => { map.invalidateSize(); }, 200);

        let markersLayer = L.layerGroup().addTo(map);
        let markersMap = {}; 

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); }, 6000);
        }

        function getCategoryColor(category) {
            if (category === 'Manzara') return '#3b82f6';
            if (category === 'Tarihi Bina / Kale') return '#f59e0b';
            if (category === 'Yerel İşletme / Esnaf') return '#10b981';
            if (category === 'Resmi Kurum') return '#ef4444';
            if (category === 'Eğitim / Kültür') return '#8b5cf6';
            return '#6b7280';
        }

        function createFlagIcon(category) {
            const color = getCategoryColor(category);
            return L.divIcon({
                className: 'custom-flag-icon',
                html: '<svg width="34" height="40" viewBox="0 0 34 40" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0px 3px 4px rgba(0,0,0,0.5));">' +
                      '<circle cx="6" cy="37" r="3" fill="#1f2937" stroke="white" stroke-width="1.5"/>' +
                      '<line x1="6" y1="4" x2="6" y2="37" stroke="white" stroke-width="4" stroke-linecap="round"/>' +
                      '<line x1="6" y1="4" x2="6" y2="37" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>' +
                      '<path d="M7 5 C15 2, 23 8, 31 5 L27 14 L31 22 C23 25, 15 19, 7 22 Z" fill="' + color + '" stroke="white" stroke-width="2" stroke-linejoin="round"/>' +
                      '</svg>',
                iconSize: [34, 40],
                iconAnchor: [6, 37],
                popupAnchor: [8, -34]
            });
        }

        function getStoredPoints() {
            try {
                const data = localStorage.getItem('candarli_user_points');
                if (data) {
                    const parsed = JSON.parse(data);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                }
                if (window.CANDARLI_DATA && Array.isArray(window.CANDARLI_DATA)) {
                    localStorage.setItem('candarli_user_points', JSON.stringify(window.CANDARLI_DATA));
                    return window.CANDARLI_DATA;
                }
                return [];
            } catch (e) {
                return [];
            }
        }

        function loadPoints() {
            markersLayer.clearLayers();
            markersMap = {};
            const points = getStoredPoints();

            points.forEach(p => {
                if (!p.lat || !p.lng) return;

                const customIcon = createFlagIcon(p.category);
                const color = getCategoryColor(p.category);
                const marker = L.marker([p.lat, p.lng], { icon: customIcon }).addTo(markersLayer);
                
                marker.bindPopup(
                    '<div class="w-64">' +
                    (p.photo ? '<img src="' + p.photo + '" class="w-full h-40 object-cover">' + '</div>' : '') +
                    '<div class="p-3.5">' +
                    '<span class="text-xs px-2.5 py-0.5 rounded-full font-semibold" style="background-color: ' + color + '20; color: ' + color + '">' + (p.category || 'Genel') + '</span>' +
                    '<h3 class="font-bold text-gray-900 mt-2 text-base">' + (p.title || 'İsimsiz Nokta') + '</h3>' +
                    '<p class="text-xs text-gray-600 mt-1 leading-relaxed">' + (p.desc || '') + '</p>' +
                    '</div></div>',
                    { className: 'custom-popup' }
                );

                markersMap[p.id] = { marker, data: p };
            });
        }

        // --- HATA AYIKLAMALI FETCH SİSTEMİ ---
        window.syncFromDataFolder = async function() {
            const btn = document.getElementById('syncBtn');
            btn.innerHTML = '<span>⏳ Yükleniyor...</span>';

            try {
                const response = await fetch('data/veriler.js?t=' + Date.now());
                if (!response.ok) {
                    throw new Error('Dosya bulunamadı (HTTP ' + response.status + ')');
                }

                const text = await response.text();
                const cleanJson = text.replace(/^window\.CANDARLI_DATA\s*=\s*/, '').replace(/;\s*$/, '');
                const points = JSON.parse(cleanJson);

                if (Array.isArray(points)) {
                    localStorage.setItem('candarli_user_points', JSON.stringify(points));
                    loadPoints();
                    showToast("✅ Harita güncellendi! (" + points.length + " nokta yüklendi)");
                } else {
                    throw new Error('Veri formatı hatalı.');
                }
            } catch (err) {
                console.error(err);
                showToast("❌ Hata Detayı: " + err.message);
            } finally {
                btn.innerHTML = '<span>🔄 Güncelle</span>';
            }
        };

        function handleSearch(query) {
            const q = (query || '').toLowerCase().trim();
            const dropdown = document.getElementById('searchDropdown');
            dropdown.innerHTML = '';
            if (!q) { dropdown.classList.add('hidden'); return; }

            const points = getStoredPoints();
            const filtered = points.filter(p => 
                (p.title && p.title.toLowerCase().includes(q)) || 
                (p.desc && p.desc.toLowerCase().includes(q)) || 
                (p.category && p.category.toLowerCase().includes(q))
            );

            if (filtered.length === 0) {
                dropdown.innerHTML = '<div class="p-3 text-xs text-gray-500 text-center">Kayıtlı yer bulunamadı</div>';
                dropdown.classList.remove('hidden');
                return;
            }

            filtered.forEach(p => {
                const item = document.createElement('div');
                item.className = 'p-3 hover:bg-blue-50 cursor-pointer border-b border-gray-100 transition text-sm';
                item.innerHTML = '<div class="font-bold text-gray-800">🚩 ' + p.title + '</div><div class="text-xs font-medium mt-0.5" style="color: ' + getCategoryColor(p.category) + '">' + p.category + '</div>';
                item.onclick = function() {
                    map.setView([p.lat, p.lng], 18);
                    if (markersMap[p.id]) markersMap[p.id].marker.openPopup();
                    dropdown.classList.add('hidden');
                    document.getElementById('searchInput').value = p.title;
                };
                dropdown.appendChild(item);
            });
            dropdown.classList.remove('hidden');
        }

        document.addEventListener('click', function(e) {
            const sInput = document.getElementById('searchInput');
            const sDrop = document.getElementById('searchDropdown');
            if (sInput && sDrop && !sInput.contains(e.target) && !sDrop.contains(e.target)) sDrop.classList.add('hidden');
        });

        loadPoints();
    </script>
</body>
</html>
